# Build the image, push it, and deploy the service — on a version tag, or by hand.
#
# It declines to run rather than failing when the secrets are absent, so a project pushed to GitHub
# before anything has been configured shows a green `ci` and a skipped `deploy`, not a red cross for
# a step its author has not reached yet. See README.md, "Deploy from GitHub".
name: deploy
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # A secret cannot be tested in a job-level `if`, so one job decides and the next obeys.
  check:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.secrets.outputs.deploy }}
    steps:
      - id: secrets
        env:
          TOKEN: ${{ secrets.ANKKA_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No ANKKA_TOKEN secret is configured, so nothing is deployed. See README.md, 'Deploy from GitHub'."
          fi

  deploy:
    needs: check
    if: needs.check.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the image to this repository's GitHub Container Registry
    env:
      DOCKER_REPOSITORY: ghcr.io/${{ github.repository_owner }}
      # The image is built for both architectures the platform runs on, so the same tag serves a
      # cluster of amd64 or arm64 nodes. Remove one to build for the other alone.
      ANKKA_IMAGE_PLATFORMS: linux/amd64,linux/arm64
    steps:
      # sbt-dynver reads the version from the tag, so the history must be there.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The architecture this runner is not is built under QEMU by a buildx builder; a JVM image
      # copies jars, so nothing is compiled under emulation.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build and push the image
        run: |
          set -euo pipefail
          # The version is sbt-dynver's: `1.2.3` on the tag `v1.2.3`, a snapshot on a manual run.
          version=$(sbt -batch -error 'print service/Docker/version' | tail -1 | tr -d '[:space:]')
          sbt service/Docker/publish
          echo "IMAGE=$DOCKER_REPOSITORY/voice:$version" >> "$GITHUB_ENV"

      # Installs the CLI, verifies it against its published checksum, and authenticates it for the
      # rest of this job. The CLI is a native executable: the Java above is for sbt, not for it.
      - uses: thinkmorestupidless/ankka-action@v1
        with:
          url: ${{ secrets.ANKKA_URL }}
          token: ${{ secrets.ANKKA_TOKEN }}
          project: ${{ secrets.ANKKA_PROJECT }}
          ca: ${{ secrets.ANKKA_CA }}

      - name: Deploy
        run: |
          set -euo pipefail
          # The descriptor's settings with the image just pushed. service.json is not rewritten, and
          # the command refuses if it names a different service.
          ankka services deploy voice "$IMAGE"
          ankka services get voice
