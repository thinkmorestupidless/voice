# Build and test on every push and pull request. Needs no secrets.
name: ci
on:
  push:
  pull_request:

jobs:
  service:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      # The suites start their own Postgres through testcontainers and stub the reasoning service;
      # the tier 3 suite against the real reasoning container is run by hand (quickstart.md).
      - run: sbt scalafmtCheckAll scalafmtSbtCheck domain/test service/test seed/test

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  features:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: >
          uvx --from "git+https://github.com/thinkmorestupidless/speckit-bdd@v0.2.0#subdirectory=checker"
          speckit-bdd check --root . --glossary GLOSSARY.md --features features --specs specs
